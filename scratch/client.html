<!doctype html>
<meta charset="utf-8" />
<title>Pixhaus client probe</title>

<!--
  Throwaway, like upload.html. Not a product surface, not the start of apps/web.

  It exists to prove three things curl cannot:
    1. a real browser can do magic link -> badge -> grid -> download with no cookie
    2. the presigned URLs embedded in /api/client/gallery load as <img src>
    3. the badge refreshes itself before it expires, without the magic link

  Delete it once apps/web exists.
-->

<style>
  body {
    font:
      14px/1.5 system-ui,
      sans-serif;
    max-width: 60rem;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  #log {
    background: #111;
    color: #ddd;
    padding: 0.75rem;
    border-radius: 4px;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    min-height: 5rem;
  }
  #grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 1rem;
  }
  figure {
    margin: 0;
    width: 200px;
  }
  figure img {
    width: 200px;
    border-radius: 4px;
    background: #eee;
    display: block;
  }
  figcaption {
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 4px;
  }
  .err {
    color: #ff8080;
  }
  /* :not([hidden]), because `display: grid` on the bare id would outrank the
     user-agent rule that makes the hidden attribute work. */
  #overlay:not([hidden]) {
    position: fixed;
    inset: 0;
    background: #000c;
    display: grid;
    place-items: center;
    cursor: zoom-out;
  }
  #overlay img {
    max-width: 92vw;
    max-height: 92vh;
  }
</style>

<h1>Client probe</h1>

<p>
  <input id="link" placeholder="magic link or token" size="70" />
  <button id="open">Open</button>
</p>

<div id="log"></div>
<div id="grid"></div>

<div id="overlay" hidden><img alt="" /></div>

<script>
  const log = (message, cls = '') =>
    (document.getElementById('log').innerHTML += `<span class="${cls}">${message}\n</span>`);

  // The badge lives here and nowhere else. Not localStorage, not a cookie: a
  // reload deliberately loses it, which is what makes /g/:token the only way in.
  let badge = null;
  let refreshTimer = null;

  async function json(url, options = {}) {
    const headers = { ...options.headers };
    if (badge) headers.authorization = `Bearer ${badge}`;

    const response = await fetch(url, { ...options, headers });
    const body = await response.json().catch(() => null);
    if (!response.ok) throw new Error(`${response.status} ${JSON.stringify(body)}`);
    return body;
  }

  /**
   * Refresh a minute before expiry. This is why POST /api/client/token exists:
   * the magic-link token is dropped from the URL below, so it is not available
   * to mint a second badge.
   */
  function scheduleRefresh(expiresAt) {
    clearTimeout(refreshTimer);
    const delay = Math.max(new Date(expiresAt) - Date.now() - 60_000, 5_000);

    refreshTimer = setTimeout(async () => {
      try {
        const session = await json('/api/client/token', { method: 'POST' });
        badge = session.token;
        log(`badge refreshed, good until ${session.expiresAt}`);
        scheduleRefresh(session.expiresAt);
      } catch (error) {
        badge = null;
        log(`refresh refused: ${error.message} — open your link again`, 'err');
      }
    }, delay);
  }

  function render(assets) {
    const grid = document.getElementById('grid');

    for (const asset of assets) {
      const figure = document.createElement('figure');

      // Straight to the bucket. No Authorization header is possible on an
      // <img>, which is exactly why these URLs are embedded in the page above.
      const img = document.createElement('img');
      img.src = asset.gridUrl ?? '';
      img.style.aspectRatio =
        asset.width && asset.height ? `${asset.width}/${asset.height}` : '3/2';
      img.title = `${asset.filename} — ${asset.width}x${asset.height}`;
      img.addEventListener('click', () => preview(asset));

      const caption = document.createElement('figcaption');
      caption.innerHTML = `<span>${asset.filename}</span>`;

      const save = document.createElement('button');
      save.textContent = 'save';
      save.addEventListener('click', () => download(asset));
      caption.append(save);

      figure.append(img, caption);
      grid.append(figure);
    }
  }

  // Inline rather than window.open: after an await the click's user activation
  // is gone and the browser blocks the popup silently.
  async function preview(asset) {
    try {
      const { url } = await json(`/api/client/assets/${asset.id}/renditions/preview`);
      const overlay = document.getElementById('overlay');
      overlay.querySelector('img').src = url;
      overlay.hidden = false;
      log(`preview: ${asset.filename}`);
    } catch (error) {
      log(error.message, 'err');
    }
  }

  async function download(asset) {
    try {
      const { url } = await json(`/api/client/assets/${asset.id}/download`, { method: 'POST' });
      log(`downloading ${asset.filename}`);
      window.location.href = url;
    } catch (error) {
      log(error.message, 'err');
    }
  }

  // Not `open`: a top-level function declaration becomes a property of the
  // global object, and would shadow window.open().
  async function openGallery(rawLink) {
    // Accept a pasted URL or a bare token.
    const token = rawLink.trim().split('/g/').pop();

    const session = await json(`/g/${encodeURIComponent(token)}`);
    badge = session.token;
    log(`rights: ${session.rights.join(', ')} — badge good until ${session.expiresAt}`);

    // The long-lived credential leaves the address bar, the history entry and
    // any Referer this page sends from here on.
    history.replaceState(null, '', '/scratch/client.html');
    document.getElementById('link').value = '';

    scheduleRefresh(session.expiresAt);

    let cursor = '';
    let total = 0;
    for (;;) {
      const query = `limit=50${cursor ? `&cursor=${cursor}` : ''}`;
      const page = await json(`/api/client/gallery?${query}`);

      if (!total) log(`gallery: ${page.gallery.title}`);
      render(page.assets);
      total += page.assets.length;

      if (!page.nextCursor) break;
      cursor = page.nextCursor;
    }

    log(`${total} photo(s), and not one of them came through the API`);
  }

  document.getElementById('overlay').addEventListener('click', (event) => {
    event.currentTarget.hidden = true;
  });

  document.getElementById('open').addEventListener('click', async () => {
    try {
      await openGallery(document.getElementById('link').value);
    } catch (error) {
      log(error.message, 'err');
    }
  });

  // Landing straight on /scratch/client.html#<token> opens it without a paste.
  if (location.hash.length > 1) {
    openGallery(location.hash.slice(1)).catch((error) => log(error.message, 'err'));
  }
</script>

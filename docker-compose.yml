name: pixhaus

services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
      ]

    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

    volumes:
      - redis-data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    restart: unless-stopped

    command: ['server', '/data', '--console-address', ':9001']

    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}

      # The browser PUTs straight to this origin, so the bucket needs CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}

    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'

    volumes:
      - minio-data:/data

    healthcheck:
      # The minio/minio image ships no shell utilities (no curl, wget, or mc) —
      # only bash and coreutils. This hits MinIO's own /minio/health/live
      # endpoint using bash's built-in /dev/tcp, verified against a live
      # container before being wired in here.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/live HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3; read -r line <&3; [[ "$$line" == *200* ]]',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: creates the bucket and locks it to private, then exits 0.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727

    depends_on:
      minio:
        condition: service_healthy

    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}

    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mc alias set local "$$STORAGE_ENDPOINT" "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
        echo "bucket $$STORAGE_BUCKET ready (private)"

    restart: 'no'

  # Dev-only: catches outgoing SMTP instead of delivering it, with a web
  # inbox at MAILPIT_UI_PORT. Nothing depends on it yet (M1/M3 send the
  # first real emails), so no healthcheck and no depends_on anywhere.
  mailpit:
    image: axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d

    restart: unless-stopped

    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  # Applies pending migrations, then exits 0. The api service waits
  # for it to finish, so `docker compose up` always starts an API whose schema
  # is current.
  #
  # It connects as the OWNER role. This is the only container that ever does —
  # the owner creates the tables, which is what makes the app role subject to
  # their row-level security policies.
  migrate:
    build:
      context: .
      target: migrate

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # `postgres`, not `localhost`: inside the compose network a service is
      # reachable by its own name. The .env values point at localhost because
      # those are for running tooling from your shell.
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    restart: 'no'

  api:
    build:
      context: .
      target: api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      # Not just minio: the bucket has to exist before /readyz can HEAD it.
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      # The APP role — owns nothing, so row-level security applies to it.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Service names, not localhost: these resolve on the compose network. The
      # .env copies of both point at localhost, for running the API on the host.
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: ${SMTP_FROM:-Pixhaus <no-reply@pixhaus.local>}

      # The origin a browser will use, which is the published port — not
      # anything reachable only from inside the network.
      APP_URL: ${APP_URL:-http://localhost:3000}

      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}

      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}

      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}

      CLIENT_TOKEN_SECRET: ${CLIENT_TOKEN_SECRET:?set CLIENT_TOKEN_SECRET in .env}
      CLIENT_TOKEN_TTL_SECONDS: ${CLIENT_TOKEN_TTL_SECONDS:-3600}
      CLIENT_URL_TTL_SECONDS: ${CLIENT_URL_TTL_SECONDS:-5400}

    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

    healthcheck:
      # /readyz, not /healthz: "healthy" here gates `--wait` and anything that
      # declares depends_on this service, and what those callers care about is
      # whether the API can actually serve — not merely that the process exists.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Consumes the rendition queue. No ports, no health check: it serves no
  # traffic, and `docker compose up --wait` should not block on it.
  worker:
    build:
      context: .
      target: worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production

      # The APP role, so RLS applies to the worker exactly as to the API.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}

      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

volumes:
  postgres-data:
  redis-data:
  minio-data:

name: pixhaus

# The core stack, and it is production-shaped: Postgres, Redis, the migration
# runner, the API and the worker. Nothing here is a stand-in.
#
# Two overlays sit beside it, selected by COMPOSE_FILE in .env:
#
#   docker-compose.dev.yml    MinIO and Mailpit, and the wiring that points the
#                             API and worker at them instead of at real services
#   docker-compose.prod.yml   Caddy, which terminates TLS
#
# Overlays rather than profiles because compose refuses to load a file whose
# depends_on names a service a profile has disabled.

services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
      ]

    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

    volumes:
      - redis-data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Applies pending migrations, then exits 0. The api service waits
  # for it to finish, so `docker compose up` always starts an API whose schema
  # is current.
  #
  # It connects as the OWNER role. This is the only container that ever does —
  # the owner creates the tables, which is what makes the app role subject to
  # their row-level security policies.
  migrate:
    build:
      context: .
      target: migrate

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # `postgres`, not `localhost`: inside the compose network a service is
      # reachable by its own name. The .env values point at localhost because
      # those are for running tooling from your shell.
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    restart: 'no'

  api:
    build:
      context: .
      target: api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      # The APP role — owns nothing, so row-level security applies to it.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Required, not defaulted: the base file knows nothing about Mailpit, and
      # a silent fallback to a mail server that is not running would look like
      # email working right up until nobody received anything.
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      SMTP_FROM: ${SMTP_FROM:-Pixhaus <no-reply@pixhaus.local>}

      # The origin a browser will use, which is the published port — not
      # anything reachable only from inside the network.
      APP_URL: ${APP_URL:-http://localhost:3000}

      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # SigV4 signs the Host header, so a URL signed for one origin cannot be
      # re-pointed at another. In production both are the same public hostname
      # and the split costs nothing; the dev overlay is where they differ.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT in .env}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?set STORAGE_PUBLIC_ENDPOINT in .env}

      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}

      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}

      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}

      CLIENT_TOKEN_SECRET: ${CLIENT_TOKEN_SECRET:?set CLIENT_TOKEN_SECRET in .env}
      CLIENT_TOKEN_TTL_SECONDS: ${CLIENT_TOKEN_TTL_SECONDS:-3600}
      CLIENT_URL_TTL_SECONDS: ${CLIENT_URL_TTL_SECONDS:-5400}

    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

    healthcheck:
      # /readyz, not /healthz: "healthy" here gates `--wait` and anything that
      # declares depends_on this service, and what those callers care about is
      # whether the API can actually serve — not merely that the process exists.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Consumes the rendition queue. No ports, no health check: it serves no
  # traffic, and `docker compose up --wait` should not block on it.
  worker:
    build:
      context: .
      target: worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production

      # The APP role, so RLS applies to the worker exactly as to the API.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT in .env}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}

      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

volumes:
  postgres-data:
  redis-data:

# Production overlay: the piece that only exists once there is a real domain.
#
# Caddy terminates TLS and proxies to the API over the compose network. It
# obtains and renews a Let's Encrypt certificate on its own..
#
# Selected by COMPOSE_FILE in .env. See docs/deployment.md.

services:
  caddy:
    image: caddy:2-alpine

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      # Caddy reads this from the Caddyfile as {$DOMAIN} and uses it both to
      # match requests and to decide which certificate to ask for.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}

    # The only service in the whole stack published on a public interface.
    # Everything else stays on 127.0.0.1, which is what keeps Postgres and Redis
    # off the internet on a box that has a public IP.
    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Without these a restart re-issues,
      # and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
